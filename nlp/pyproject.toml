[project]
name = "vw-nlp"
version = "0.1.0"
description = "VW POS tagger on UD English-EWT, and VW copies of spaCy's tagger, sentence splitter, NER and parser"
requires-python = ">=3.12"
dependencies = [
    "vowpalwabbit>=9.11.9",
]

[dependency-groups]
spacy = [
    "en-core-web-sm",
    "spacy==3.8.16",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

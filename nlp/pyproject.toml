[project]
name = "vw-universal-dependencies"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "vowpalwabbit>=9.11.9",
]

[dependency-groups]
spacy = [
    "en-core-web-sm",
    "spacy==3.8.16",
]
wikitext = [
    "pyarrow==22.0.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

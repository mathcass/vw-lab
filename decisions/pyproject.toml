[project]
name = "vw-decisions"
version = "0.1.0"
description = "Can Vowpal Wabbit replace Jev-style decision models?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
    "vowpalwabbit==9.11.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vwjev"]

[tool.uv]
package = true
